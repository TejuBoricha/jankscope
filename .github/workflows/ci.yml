name: CI - Build, Static Safety Proofs & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: 'skip'

jobs:
  verify-windows:
    name: Windows x64 (.NET 10 SDK | Safety Proofs | 2,505 Tests | Smoke Gate)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Validate PR branch naming and target branch
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          Write-Host "PR branch: '$env:HEAD_REF' -> '$env:BASE_REF'"
          if ($env:BASE_REF -ne 'main') {
              Write-Host "::error::Pull requests must target 'main' (found '$env:BASE_REF')."
              exit 1
          }
          $pattern = '^((feat|fix|hotfix|docs|test|ci|chore|refactor)/[a-z0-9][a-z0-9._-]*|dependabot/[a-z0-9._/-]+)$'
          if ($env:HEAD_REF -notmatch $pattern) {
              Write-Host "::error::Branch name '$env:HEAD_REF' does not follow the required convention '<type>/<short-kebab-slug>' (allowed types: feat, fix, hotfix, docs, test, ci, chore, refactor). See CONTRIBUTING.md."
              exit 1
          }
          Write-Host "Branch naming convention verified."

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pinned .NET 10 SDK (global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet global packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run build, banned-symbol proof, analyzer wiring proof, test suite & CLI smoke gate
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      # Renders every window the App tests draw (WpfTests) to PNG, so each run keeps a current picture of the design.
      - name: Render the app's windows to PNG
        shell: pwsh
        env:
          JANKSCOPE_SNAPSHOT_DIR: ${{ github.workspace }}/app-snapshots
        run: dotnet test tests/Jankscope.App.Tests -c Release --filter "FullyQualifiedName~WpfTests"

      - name: Keep the rendered app windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-window-renders
          path: app-snapshots/
          if-no-files-found: warn
          retention-days: 30
