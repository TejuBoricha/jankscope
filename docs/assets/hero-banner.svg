<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0B111E"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="amberBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="lookbackBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="450" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Background Grid -->
  <g stroke="#1E293B" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="44" x2="1200" y2="44"/>
    <line x1="60" y1="0" x2="60" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="900" y1="0" x2="900" y2="450"/>
    <line x1="1140" y1="0" x2="1140" y2="450"/>
  </g>

  <!-- Top Telemetry Bezel Bar -->
  <rect x="1" y="1" width="1198" height="42" rx="15" fill="#0B1324" opacity="0.9"/>
  <line x1="1" y1="43" x2="1199" y2="43" stroke="#1E293B" stroke-width="1"/>
  <circle cx="26" cy="22" r="5" fill="#10B981"/>
  <circle cx="26" cy="22" r="9" fill="none" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  <text x="44" y="26" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.2">JANKSCOPE // PRECISION FRAME &amp; STUTTER DIAGNOSTIC INSTRUMENT</text>
  <text x="1174" y="26" text-anchor="end" fill="#38BDF8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.8">WINDOWS 10/11 x64 · .NET 10 · ZERO TELEMETRY</text>

  <!-- Brand Mark & Title Section -->
  <g transform="translate(56, 68)">
    <!-- Scope Crosshair + Waveform Emblem -->
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="10" y1="32" x2="54" y2="32" stroke="#1E293B" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="32" y1="10" x2="32" y2="54" stroke="#1E293B" stroke-width="1" stroke-dasharray="2,2"/>
    <polyline points="10,42 22,42 26,42 31,14 36,48 40,42 54,42" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
    <circle cx="31" cy="14" r="3.5" fill="#F97316"/>

    <text x="82" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.8">Jankscope</text>
    <rect x="292" y="14" width="118" height="24" rx="6" fill="#0F2922" stroke="#10B981" stroke-width="1"/>
    <text x="351" y="30" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.6">STAGE 1 VERIFIED</text>

    <text x="84" y="64" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15.5" font-weight="400">
      Explain <tspan fill="#E2E8F0" font-weight="600">why</tspan> a game stutters, a mouse freezes, or frame pacing drops — using evidence-graded hypotheses, never snake oil.
    </text>
  </g>

  <!-- Oscilloscope Viewport Panel -->
  <g transform="translate(48, 152)">
    <rect width="1104" height="218" rx="10" fill="url(#panelGrad)" stroke="#1E293B" stroke-width="1.2"/>

    <!-- Scope Header Strip -->
    <rect x="1" y="1" width="1102" height="30" rx="9" fill="#0B111E"/>
    <line x1="1" y1="31" x2="1103" y2="31" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="20" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">CH1: DXGI_SWAP_EFFECT_FLIP_DISCARD (TimeInMs / MsBetweenPresents)</text>
    <text x="560" y="20" fill="#38BDF8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">BASELINE MEDIAN: 6.94 ms (144.0 FPS)</text>
    <text x="1088" y="20" text-anchor="end" fill="#F59E0B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">ANCHOR LOOKBACK: -10.0 s .. +UNCERTAINTY</text>

    <!-- 10-Second Candidate Anchor Search Region -->
    <rect x="420" y="32" width="540" height="156" fill="url(#lookbackBand)"/>
    <line x1="420" y1="32" x2="420" y2="188" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="428" y="46" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">SEARCH WINDOW START (-10.0 s)</text>

    <!-- Horizontal Frame-Time Graticules -->
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#64748B">
      <!-- 100 ms (10 fps) -->
      <line x1="92" y1="56" x2="1088" y2="56" stroke="#1E293B" stroke-width="1"/>
      <text x="84" y="59" text-anchor="end">100.0 ms</text>
      <!-- 50 ms (20 fps) -->
      <line x1="92" y1="96" x2="1088" y2="96" stroke="#1E293B" stroke-width="1"/>
      <text x="84" y="99" text-anchor="end">50.0 ms</text>
      <!-- 33.3 ms (30 fps) -->
      <line x1="92" y1="122" x2="1088" y2="122" stroke="#1E293B" stroke-width="1"/>
      <text x="84" y="125" text-anchor="end">33.3 ms</text>
      <!-- 16.7 ms (60 fps) -->
      <line x1="92" y1="150" x2="1088" y2="150" stroke="#1E293B" stroke-width="1"/>
      <text x="84" y="153" text-anchor="end">16.7 ms</text>
      <!-- 6.9 ms (144 fps) -->
      <line x1="92" y1="172" x2="1088" y2="172" stroke="#1E293B" stroke-width="1" stroke-dasharray="2,4"/>
      <text x="84" y="175" text-anchor="end" fill="#38BDF8">6.9 ms</text>
    </g>

    <!-- Collector Gap Band -->
    <rect x="520" y="32" width="34" height="156" fill="#334155" opacity="0.28"/>
    <line x1="520" y1="32" x2="520" y2="188" stroke="#64748B" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="554" y1="32" x2="554" y2="188" stroke="#64748B" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="537" cy="76" r="10" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="537" y="80" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">2</text>
    <text x="537" y="96" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">GAP 142 ms</text>

    <!-- Selected Event Anchor Vertical Line (Candidate #1) -->
    <line x1="734" y1="32" x2="734" y2="188" stroke="#10B981" stroke-width="2"/>

    <!-- Key-Press Uncertainty Band & Dashed Line -->
    <rect x="946" y="32" width="28" height="156" fill="url(#amberBand)"/>
    <line x1="960" y1="32" x2="960" y2="188" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="5,4"/>
    <text x="952" y="182" text-anchor="end" fill="#FBBF24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600">KEY PRESSED (Ctrl+Alt+F9) ±4.2 ms</text>

    <!-- Waveform Area Fill -->
    <path d="M 92,172 L 310,172 L 315,134 L 320,172 L 520,172 L 520,188 L 554,188 L 554,172 L 728,172 L 734,58 L 740,172 L 856,172 L 861,144 L 866,172 L 1088,172 L 1088,188 L 92,188 Z" fill="url(#cyanGlow)"/>

    <!-- Frame-Time Waveform Trace -->
    <polyline points="92,172 150,172 154,171 158,172 230,172 234,170 238,172 310,172 315,134 320,172 410,172 465,171 470,172 520,172" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
    <polyline points="554,172 620,172 625,171 630,172 728,172 734,58 740,172 856,172 861,144 866,172 960,172 1020,171 1025,172 1088,172" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linejoin="round" filter="url(#glowCyan)"/>

    <!-- Highlight Spike Peak (Candidate #1) -->
    <polyline points="728,172 734,58 740,172" fill="none" stroke="#F97316" stroke-width="2.6" stroke-linejoin="round" filter="url(#glowRed)"/>
    <circle cx="734" cy="58" r="11" fill="#EF4444" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="734" y="62" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="800">1</text>

    <!-- Candidate #1 Callout Box -->
    <rect x="752" y="42" width="182" height="44" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
    <text x="762" y="59" fill="#34D399" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700">ANCHOR #1 · STUTTER EVENT</text>
    <text x="762" y="75" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">96.7 ms (+89.8 ms · Severe)</text>

    <!-- Candidate #3 Weak Spike Marker -->
    <circle cx="861" cy="126" r="9.5" fill="#0F172A" stroke="#F97316" stroke-width="1.5"/>
    <text x="861" y="130" text-anchor="middle" fill="#FDBA74" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">3</text>

    <!-- Reaction Lag Annotation Arrow -->
    <line x1="738" y1="108" x2="956" y2="108" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <polygon points="738,108 745,104 745,112" fill="#94A3B8"/>
    <polygon points="956,108 949,104 949,112" fill="#94A3B8"/>
    <rect x="794" y="97" width="108" height="20" rx="4" fill="#0B111E" stroke="#334155" stroke-width="0.8"/>
    <text x="848" y="110" text-anchor="middle" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">reaction: 420 ms</text>

    <!-- Timeline X-Axis Labels -->
    <line x1="92" y1="188" x2="1088" y2="188" stroke="#334155" stroke-width="1"/>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#64748B">
      <text x="160" y="205" text-anchor="middle">-25.0 s</text>
      <text x="290" y="205" text-anchor="middle">-20.0 s</text>
      <text x="420" y="205" text-anchor="middle">-10.0 s</text>
      <text x="580" y="205" text-anchor="middle">-5.0 s</text>
      <text x="734" y="205" text-anchor="middle" fill="#34D399" font-weight="700">event (-0.42 s)</text>
      <text x="960" y="205" text-anchor="middle" fill="#FBBF24">key press (0.0 s)</text>
      <text x="1065" y="205" text-anchor="middle">+post-roll</text>
    </g>
  </g>

  <!-- Bottom Verified Telemetry Pills -->
  <g transform="translate(48, 386)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">
    <rect x="0" y="0" width="208" height="38" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="18" cy="19" r="4" fill="#10B981"/>
    <text x="30" y="23" fill="#E2E8F0">2,504 <tspan fill="#64748B">TESTS PASSING</tspan></text>

    <rect x="224" y="0" width="212" height="38" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="242" cy="19" r="4" fill="#38BDF8"/>
    <text x="254" y="23" fill="#E2E8F0">106 <tspan fill="#64748B">BANNED API PROOFS</tspan></text>

    <rect x="452" y="0" width="224" height="38" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="470" cy="19" r="4" fill="#10B981"/>
    <text x="482" y="23" fill="#E2E8F0">+0.009 ms <tspan fill="#64748B">OBSERVER DELTA</tspan></text>

    <rect x="692" y="0" width="206" height="38" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="710" cy="19" r="4" fill="#F59E0B"/>
    <text x="722" y="23" fill="#E2E8F0">0.68% CPU <tspan fill="#64748B">· 199 MB RAM</tspan></text>

    <rect x="914" y="0" width="190" height="38" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="932" cy="19" r="4" fill="#A855F7"/>
    <text x="944" y="23" fill="#E2E8F0">0 SOCKETS <tspan fill="#64748B">· MIT</tspan></text>
  </g>
</svg>
