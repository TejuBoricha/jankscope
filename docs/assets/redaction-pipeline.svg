      <text x="16" y="94">• Scans Uri.UnescapeDataString</text>
      <text x="16" y="112">• Parses JsonDocument &amp; scans</text>
      <text x="16" y="130">  every unescaped key &amp; string</text>
      <text x="16" y="148" fill="#FBBF24">• Any leak -&gt; throws</text>
      <text x="16" y="166" fill="#FBBF24">  ExportBlockedException</text>
    </g>
  </g>

  <line x1="890" y1="161" x2="914" y2="161" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- Step 4: Verified ExportPreview & Atomic Disk Write -->
  <g transform="translate(918, 66)">
    <rect width="254" height="190" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
    <text x="16" y="28" fill="#34D399" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700">4. ATOMIC VERIFIED EXPORT</text>
    <text x="16" y="50" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Preview == Bytes on Disk</text>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#A7F3D0">
