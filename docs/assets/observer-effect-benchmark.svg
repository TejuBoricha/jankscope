    <text x="20" y="68" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800">+0.009 ms</text>
    <text x="220" y="64" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">budget &lt; 0.200 ms</text>

    <!-- Condition A vs B Bars -->
    <text x="20" y="104" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">Condition A (Collectors OFF): 0.057 ms (IQR 0.013)</text>
    <rect x="20" y="112" width="324" height="12" rx="4" fill="#1E293B"/>
    <rect x="20" y="112" width="92" height="12" rx="4" fill="url(#barBlue)"/>

    <text x="20" y="146" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">Condition B (Collectors ON):  0.066 ms (IQR 0.014)</text>
    <rect x="20" y="154" width="324" height="12" rx="4" fill="#1E293B"/>
    <rect x="20" y="154" width="107" height="12" rx="4" fill="url(#barEmerald)"/>

    <line x1="20" y1="184" x2="344" y2="184" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="208" fill="#34D399" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700">✓ PASS · 22x BELOW DISTURBANCE LIMIT</text>
  </g>

  <!-- Card 2: Frame-Time Error Delta & Disturbed Frames -->
  <g transform="translate(418, 64)">
    <rect width="364" height="232" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="20" y="30" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">FRAME-TIME ERROR DELTA (MEDIAN)</text>
    <text x="20" y="68" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800">+0.002 ms</text>
