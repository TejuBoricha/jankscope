      <text x="16" y="94">• Exact SHA-256 hash shown</text>
      <text x="16" y="112">  in UI before saving</text>
      <text x="16" y="130">• Category replacement counts</text>
      <text x="16" y="148">• Flush(true) to .tmp file</text>
      <text x="16" y="166">  + atomic File.Move</text>
    </g>
