  <rect width="1200" height="320" rx="14" fill="url(#ovhBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="1" y="1" width="1198" height="44" rx="13" fill="#0B1324"/>
