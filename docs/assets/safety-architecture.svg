      <text x="30" y="128" fill="#94A3B8">Strict argv allowlist refuses --restart_as_admin &amp; unknown flags</text>

      <text x="16" y="156" fill="#34D399" font-weight="700">✓ Exact Pinned Set of 26 System32 LibraryImports</text>
      <text x="30" y="174" fill="#94A3B8">[DefaultDllImportSearchPaths(DllImportSearchPath.System32)] enforced</text>
      <text x="30" y="190" fill="#94A3B8">RegisterHotKey (WM_HOTKEY) · DXGI LUID · CCD Display · SCM QueryServiceStatusEx</text>

      <text x="16" y="218" fill="#34D399" font-weight="700">✓ Self-Testing Build Proofs (tools/dev/verify-*.ps1)</text>
      <text x="30" y="236" fill="#94A3B8">Every build compiles 109 forbidden call-sites in Coverage.cs.txt and proves</text>
      <text x="30" y="252" fill="#94A3B8">all 106 BannedSymbols.txt rules fire RS0030 across all 7 product projects</text>
    </g>
  </g>
</svg>
