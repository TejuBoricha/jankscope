    <rect x="20" y="154" width="324" height="12" rx="4" fill="#1E293B"/>
    <rect x="20" y="154" width="49" height="12" rx="4" fill="url(#barEmerald)"/>

    <line x1="20" y1="184" x2="344" y2="184" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="208" fill="#34D399" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700">✓ PASS · 0 DISTURBED FRAMES ACROSS 10 RUNS</text>
  </g>

  <!-- Card 3: Desktop App Resource Budget (HC-4 / HC-6) -->
  <g transform="translate(808, 64)">
    <rect width="364" height="232" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="20" y="30" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">DESKTOP APP SELF-OVERHEAD (HC-6)</text>
    <text x="20" y="68" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800">0.682% <tspan font-size="18" fill="#94A3B8" font-weight="600">CPU</tspan></text>
    <text x="235" y="64" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">budget &lt;= 1.0%</text>

    <text x="20" y="104" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">Logical CPU Utilization: 0.682% / 1.000% max</text>
    <rect x="20" y="112" width="324" height="12" rx="4" fill="#1E293B"/>
    <rect x="20" y="112" width="221" height="12" rx="4" fill="url(#barBlue)"/>

    <text x="20" y="146" fill="#CBD5E1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">Working Set (RAM):       198.9 MB / 250.0 MB max</text>
    <rect x="20" y="154" width="324" height="12" rx="4" fill="#1E293B"/>
    <rect x="20" y="154" width="257" height="12" rx="4" fill="url(#barEmerald)"/>

    <line x1="20" y1="184" x2="344" y2="184" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="208" fill="#34D399" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700">✓ PASS · 0 TCP / 0 UDP ENDPOINTS (HC-4)</text>
