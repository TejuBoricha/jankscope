  <text x="28" y="28" fill="#E2E8F0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1">OBSERVER-EFFECT &amp; SELF-OVERHEAD BENCHMARK // 10 INTERLEAVED A-B-A-B RUNS (300 FRAMES @ 144 FPS D3D11 FLIP)</text>
  <text x="1172" y="28" text-anchor="end" fill="#38BDF8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">SPEC SECTION 14 &amp; HC-6</text>

  <!-- Card 1: Present() Return Error Delta -->
  <g transform="translate(28, 64)">
